aid: medix-infusion
name: Medix Infusion
description: 'Medix Infusion, Inc. is a technology-enabled infusion care provider headquartered
  in Addison, Texas, that administers infusion and injectable therapies — anti-infectives,
  biologics, IVIG and other specialty medications — to chronically and acutely ill patients
  through a network of ambulatory infusion suites and in the home. The company concentrates
  on rural, suburban and other under-served markets, coordinating benefits investigation,
  prior authorization, scheduling, pharmacy and nursing around each referral, and is
  accredited by the Accreditation Commission for Health Care (ACHC). It raised a $35M
  Series B led by Echo Health Ventures in January 2023 alongside existing investor
  Noro-Moseley Partners. Medix Infusion operates as a care-delivery organization: it
  publishes no developer portal, no API documentation and no machine-readable API
  contract on any public host as of this profile.'
